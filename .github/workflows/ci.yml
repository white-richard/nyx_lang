name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install Flex and Bison
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Smoke tests
        run: zig build smoke
